services:
  # Image de base construite depuis scratch, utilisée par les 3 autres images.
  # Son conteneur ne fait rien : il lance "true" et s'arrête tout de suite (code 0).
  base:
    build: ./base
    image: devdocker-base
    command: ["true"]

  back:
    build:
      context: ./back
      additional_contexts:
        base: service:base
    environment:
      FLIGHT_PROVIDER: ${FLIGHT_PROVIDER:-mock}
      TRAVELPAYOUTS_TOKEN: ${TRAVELPAYOUTS_TOKEN:-}
      FPM_MAX_CHILDREN: ${FPM_MAX_CHILDREN:-4}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-48M}
    deploy:
      resources:
        limits:
          cpus: "${BACK_CPUS:-1}"
          memory: ${BACK_MEMORY:-256M}
    healthcheck:
      test: ["CMD", "php83", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s

  front:
    build:
      context: ./front
      additional_contexts:
        base: service:base
    environment:
      PORT: ${FRONT_PORT:-3000}
      NODE_MAX_MEMORY: ${NODE_MAX_MEMORY:-96}
    deploy:
      resources:
        limits:
          cpus: "${FRONT_CPUS:-0.5}"
          memory: ${FRONT_MEMORY:-128M}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s

  proxy:
    build:
      context: ./proxy
      additional_contexts:
        base: service:base
    ports:
      - "${PROXY_PORT:-8088}:80"
    environment:
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-2}
      FRONT_PORT: ${FRONT_PORT:-3000}
    deploy:
      resources:
        limits:
          cpus: "${PROXY_CPUS:-0.5}"
          memory: ${PROXY_MEMORY:-64M}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: 10s
    depends_on:
      back:
        condition: service_healthy
      front:
        condition: service_healthy
